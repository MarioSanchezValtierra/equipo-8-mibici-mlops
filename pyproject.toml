[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_mlops"
version = "0.0.1"
description = "Proyecto MLOps para predecir los flujos de entrada y salida de las estaciones de MiBici con tres días de anticipación, identificar posibles desequilibrios y apoyar la planeación operativa de la redistribución de bicicletas."
authors = [
  { name = "Equipo 8" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "mlflow",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]

requires-python = "~=3.13.0"

[tool.ruff]
line-length = 99
src = ["mibici_mlops"]
include = ["pyproject.toml", "mibici_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_mlops"]
force-sort-within-sections = true